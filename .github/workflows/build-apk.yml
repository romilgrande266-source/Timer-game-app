name: Build apk (32-bit + 64-bit)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Locate project and verify files
        run: |
          P=$(dirname "$(find . -name project.godot -not -path './.git/*' | head -1)")
          echo "Project folder: $P"
          if [ "$P" != "." ]; then
            cp -a "$P"/. .
          fi
          MISSING=""
          for f in project.godot export_presets.cfg android/plugins/TimerOverlay.gdap \
                   android_plugin/settings.gradle.kts android_plugin/build.gradle.kts \
                   android_plugin/src/main/AndroidManifest.xml \
                   android_plugin/src/main/java/com/timergame/overlay/OverlayService.kt; do
            if [ ! -f "$f" ]; then echo "MISSING FILE: $f"; MISSING=1; fi
          done
          if [ -n "$MISSING" ]; then
            echo "---- files found in repo ----"
            find . -path ./.git -prune -o -type f -print | head -150
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "cmdline-tools;latest" "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot and Android templates
        run: |
          curl -fL -o godot.zip "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -fL -o templates.tpz "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz 'templates/android*' 'templates/version.txt' -d tpl
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          ls -la ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Build TimerOverlay plugin (.aar)
        run: |
          mkdir -p android_plugin/libs android/plugins
          LIB=android_plugin/libs/godot-lib.aar
          if ! curl -fL -o "$LIB" "$GODOT_BASE/godot-lib.${GODOT_VERSION}.stable.template_release.aar"; then
            rm -f "$LIB"
            unzip -o -j ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip 'libs/release/*.aar' -d android_plugin/libs
            LIB=$(ls android_plugin/libs/*.aar | head -1)
          fi
          unzip -p "$LIB" classes.jar > android_plugin/libs/godot-classes.jar
          rm -f android_plugin/libs/*.aar
          (cd android_plugin && gradle assembleRelease --no-daemon)
          cp android_plugin/build/outputs/aar/*-release.aar android/plugins/TimerOverlay.aar
          ls -la android/plugins

      - name: Install Android build template
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore

      - name: Signing keystore and Godot editor settings
        run: |
          if [ -f signing/debug.keystore ]; then
            cp signing/debug.keystore "$HOME/debug.keystore"
            echo "Using signing/debug.keystore (same signature on every build)"
          else
            keytool -genkey -v -keystore "$HOME/debug.keystore" -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF2
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.7.tres

      - name: Check export presets
        run: |
          grep -q 'name="Android Universal (32+64-bit)"' export_presets.cfg || { echo "export_presets.cfg is missing the 32/64-bit Android presets"; exit 1; }

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Export APK - Universal (32-bit + 64-bit)
        run: |
          mkdir -p build/android
          rm -rf android/build/build
          godot --headless --path . --export-debug "Android Universal (32+64-bit)" build/android/TimerGame-universal.apk

      - name: Export APK - 64-bit only (arm64-v8a)
        run: |
          rm -rf android/build/build
          godot --headless --path . --export-debug "Android 64-bit" build/android/TimerGame-arm64-v8a.apk

      - name: Export APK - 32-bit only (armeabi-v7a)
        run: |
          rm -rf android/build/build
          godot --headless --path . --export-debug "Android 32-bit" build/android/TimerGame-armeabi-v7a.apk
          ls -la build/android

      - uses: actions/upload-artifact@v4
        with:
          name: TimerGame-apk-32bit-64bit
          path: build/android/*.apk
