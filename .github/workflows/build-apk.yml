name: Build apk

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The repo may hold the project only as a .zip (uploaded from a phone). Unpack the newest one.
      - name: Unpack project from zip (if needed)
        run: |
          if [ ! -f project.godot ]; then
            ZIP=$(ls timer_game_v[0-9]*.zip | sort -V | tail -1)
            echo "Unpacking $ZIP"
            mkdir -p unpacked
            unzip -q "$ZIP" -d unpacked
            cp -a unpacked/timer_game/. .
            rm -rf unpacked
          fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "cmdline-tools;latest" "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot and Android templates
        run: |
          curl -fL -o godot.zip "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -fL -o templates.tpz "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz 'templates/android*' 'templates/version.txt' -d tpl
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          ls -la ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Build TimerOverlay plugin (.aar)
        run: |
          mkdir -p android_plugin/libs android/plugins
          LIB=android_plugin/libs/godot-lib.aar
          if ! curl -fL -o "$LIB" "$GODOT_BASE/godot-lib.${GODOT_VERSION}.stable.template_release.aar"; then
            rm -f "$LIB"
            unzip -o -j ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip 'libs/release/*.aar' -d android_plugin/libs
            LIB=$(ls android_plugin/libs/*.aar | head -1)
          fi
          unzip -p "$LIB" classes.jar > android_plugin/libs/godot-classes.jar
          rm -f android_plugin/libs/*.aar
          gradle -p android_plugin assembleRelease --no-daemon
          cp android_plugin/build/outputs/aar/*-release.aar android/plugins/TimerOverlay.aar
          ls -la android/plugins

      - name: Install Android build template
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore

      - name: Debug keystore and Godot editor settings
        run: |
          keytool -genkey -v -keystore "$HOME/debug.keystore" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF2
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.7.tres

      - name: Write Android export preset
        run: |
          cat > export_presets.cfg <<'EOF2'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter="android_plugin/*, hardware/*, tests/*, .github/*"
          export_path="build/android/TimerGame.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.timergame.app"
          package/name="TIMER GAME"
          package/signed=true
          screen/immersive_mode=true
          plugins/TimerOverlay=true
          EOF2

      - name: Import and export APK
        run: |
          mkdir -p build/android
          godot --headless --path . --import || true
          godot --headless --path . --export-debug "Android" build/android/TimerGame.apk
          ls -la build/android

      - uses: actions/upload-artifact@v4
        with:
          name: TimerGame-apk
          path: build/android/TimerGame.apk
